name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The wrapper, not the runner's own mvn: the wrapper pins the Maven
      # version, so CI builds with the same one a developer does. Calling `mvn`
      # here meant the build that gates main could differ from the build that
      # passed locally, for a reason nobody would think to look for.
      - name: Build and run tests
        run: ./mvnw -B verify

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
