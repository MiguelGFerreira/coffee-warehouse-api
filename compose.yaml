services:
  db:
    image: postgres:16-alpine
    container_name: coffee-db
    environment:
      POSTGRES_DB: coffee_warehouse
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
    ports:
      - "5432:5432"
    volumes:
      - coffee-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffee_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: coffee-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/coffee_warehouse
      DB_USER: coffee
      DB_PASSWORD: coffee
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  coffee-pgdata:
