services:
  db:
    image: postgres:16-alpine
    container_name: coffee-db
    environment:
      POSTGRES_DB: coffee_warehouse
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
    ports:
      - "5432:5432"
    volumes:
      - coffee-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffee_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: coffee-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/coffee_warehouse
      DB_USER: coffee
      DB_PASSWORD: coffee
      # Adds db/seed to the Flyway locations, so a clean clone comes up
      # with a warehouse that already holds coffee. See
      # src/main/resources/db/seed/R__seed.sql for the credentials.
      SPRING_PROFILES_ACTIVE: dev
      # The signing key is a development default committed in
      # application.yml. Anything reachable from outside a laptop must
      # override it here, or in the environment that runs this file.
      JWT_SECRET: ${JWT_SECRET:-dev-only-signing-key-change-me-in-any-real-deployment}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  coffee-pgdata:
